# Имя workflow, которое будет отображаться в GitHub Action
name: Deploy to Docker Server
run-name: "🚀 Deploy: ${{ github.event.head_commit.message || 'Manual run' }}"

# Триггер — запускать workflow при каждом пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # GitHub Actions будет выполнять всё на виртуальной Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 🔹 Единственный шаг — подключаемся по SSH к серверу
      - name: Trigger SSH connection to start deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            echo "Connecting to server... deploy should start automatically"
          # После этого сервер выполнит скрипт.sh
